name: docker

# Docker publishing is dispatched as soon as the release version is created.
# It therefore runs independently of the Windows binary builds in release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
      tag:
        description: Git tag associated with this image
        required: true
        type: string
      sha:
        description: Commit to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-image:
    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=publish-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-docker-${{ matrix.arch }}

  publish-image:
    name: Publish Docker tags
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          source="${IMAGE}:${VERSION}"

          for tag in latest "$VERSION" "$minor"; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "$source-amd64" \
              "$source-arm64"
          done

      - name: Verify Docker tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          for tag in latest "$VERSION" "$minor"; do
            docker buildx imagetools inspect "${IMAGE}:${tag}"

  build-builder-image:
    name: Build builder ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: plugin-builder
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:builder-${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=publish-builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-builder-${{ matrix.arch }}

  publish-builder-image:
    name: Publish builder tags
    needs: build-builder-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create builder multi-platform tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source="${IMAGE}:builder-${VERSION}"
          docker buildx imagetools create \
            --tag "${IMAGE}:builder" \
            "$source-amd64" \
            "$source-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE}:builder-${VERSION}" \
            "$source-amd64" \
            "$source-arm64"

      - name: Verify builder tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}:builder"
          docker buildx imagetools inspect "${IMAGE}:builder-${VERSION}"
