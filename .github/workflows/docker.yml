name: docker

# Images are published to GHCR so a deployment is `docker run
# ghcr.io/<owner>/tdrive:latest` with nothing else to install.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Build each architecture in its own runner. The Dockerfile keeps
          # the compile stages on BUILDPLATFORM, so this does not need QEMU.
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || '0.1' }}
          # Keep the two architecture caches independent so parallel jobs do
          # not overwrite each other's layers.
          cache-from: type=gha,scope=release-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-docker-${{ matrix.arch }}

  publish:
    name: Publish multi-platform manifests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Create multi-platform manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_TAGS: ${{ steps.meta.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools create \
                --tag "$tag" \
                "$IMAGE:build-${SHA}-amd64" \
                "$IMAGE:build-${SHA}-arm64"
            fi
          done <<< "$SOURCE_TAGS"

      - name: Verify published manifests
        env:
          SOURCE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools inspect "$tag"
            fi
          done <<< "$SOURCE_TAGS"

      - name: Summary
        env:
          SOURCE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$SOURCE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
