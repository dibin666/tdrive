name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Create release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Increment patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          current="$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname \
            | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -n "$current" ]; then
            tag="$current"
            version="${current#v}"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              value="${latest#v}"
              IFS=. read -r major minor patch <<< "$value"
              version="$major.$minor.$((patch + 1))"
            fi

            tag="v$version"
            while git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; do
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
              tag="v$version"
            done

            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" "$GITHUB_SHA" -m "Release $version"
            git push origin "$tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build ${{ matrix.arch }} image
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=publish-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-docker-${{ matrix.arch }}

  publish-image:
    name: Publish Docker tags
    needs: [version, build-image]
    runs-on: ubuntu-latest

    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          source="${IMAGE}:${VERSION}"

          for tag in latest "$VERSION" "$minor"; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "$source-amd64" \
              "$source-arm64"
          done

      - name: Verify Docker tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          minor="${VERSION%.*}"
          for tag in latest "$VERSION" "$minor"; do
            docker buildx imagetools inspect "${IMAGE}:${tag}"
          done

  build-binary:
    name: Build ${{ matrix.arch }} binary
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            asset: linux-amd64
          - arch: arm64
            asset: linux-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build embedded UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build binary
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o "release/tdrive-$ASSET" ./cmd/tdrive

      - uses: actions/upload-artifact@v7
        with:
          name: tdrive-${{ needs.version.outputs.tag }}-${{ matrix.asset }}
          path: release/tdrive-${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [version, build-binary]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tdrive-${{ needs.version.outputs.tag }}-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION"
