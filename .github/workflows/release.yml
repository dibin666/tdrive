name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Create release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Increment patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          current="$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname \
            | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [ -n "$current" ]; then
            tag="$current"
            version="${current#v}"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
            if [ -z "$latest" ]; then
              version="0.1.0"
            else
              value="${latest#v}"
              IFS=. read -r major minor patch <<< "$value"
              version="$major.$minor.$((patch + 1))"
            fi

            tag="v$version"
            while git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; do
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
              tag="v$version"
            done

            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" "$GITHUB_SHA" -m "Release $version"
            git push origin "$tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  dispatch-docker:
    name: Start Docker image publish
    needs: version
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Dispatch Docker workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run docker.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f version="$VERSION" \
            -f tag="$TAG" \
            -f sha="$SHA"

  build-binary:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }} binary
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: linux-amd64
          - goos: linux
            goarch: arm64
            asset: linux-arm64
          - goos: windows
            goarch: amd64
            asset: windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: windows-arm64.exe

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build embedded UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p release
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$VERSION" \
            -o "release/tdrive-$ASSET" ./cmd/tdrive

      - uses: actions/upload-artifact@v7
        with:
          name: tdrive-${{ needs.version.outputs.tag }}-${{ matrix.asset }}
          path: release/tdrive-${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: [version, build-binary]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tdrive-${{ needs.version.outputs.tag }}-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION"
