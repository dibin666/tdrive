name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            asset: linux-amd64
          - arch: arm64
            asset: linux-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Build embedded UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build binary
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p release
          version="${VERSION#v}"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" \
            go build -trimpath -ldflags="-s -w -X main.version=$version" \
            -o "release/tdrive-$ASSET" ./cmd/tdrive

      - uses: actions/upload-artifact@v7
        with:
          name: tdrive-${{ github.ref_name }}-${{ matrix.asset }}
          path: release/tdrive-${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tdrive-${{ github.ref_name }}-*
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${VERSION#v}"
