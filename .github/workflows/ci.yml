name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # The Go build embeds ui/dist. CI does not need the real interface to
      # compile and test the server, so a placeholder keeps the Go job
      # independent of the Node one.
      - name: Stub the embedded UI
        run: |
          mkdir -p ui/dist
          echo '<!doctype html><title>ci</title>' > ui/dist/index.html

      - run: go build ./...
      - run: go vet ./...

      # The race detector is the point of this job: the segment reader and the
      # upload pipeline are both concurrent, and a data race there corrupts
      # files rather than crashing.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./ui)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    # A build that cannot be containerised is not shippable, so the image is
    # built (without publishing) on every pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
